<title>EchoLift Rig Studio</title>
<!-- vendored so the studio runs offline, straight off disk, with no CDN -->
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="skeleton.js"></script>
<script src="poses.js"></script>
<style>
/* ── EchoLift tokens (from Theme.swift) ───────────────────────── */
:root{
  --accent:#4073FF;
  --mint:#33D999;
  --amber:#FFA000;
  --red:#FF4D5E;

  --bg:#F2F3F6;
  --surface:rgba(255,255,255,.82);
  --surface-solid:#FFFFFF;
  --line:rgba(20,24,34,.12);
  --ink:#14161C;
  --ink-2:#525A69;
  --ink-3:#858C9B;
  --viewport-a:#E9ECF2;
  --viewport-b:#CFD5E0;
  --shadow:0 8px 28px rgba(20,26,40,.13);
}
:root[data-theme="dark"]{
  --bg:#141416;
  --surface:rgba(35,35,40,.80);
  --surface-solid:#232327;
  --line:rgba(255,255,255,.11);
  --ink:#EDEEF2;
  --ink-2:#AEB4C0;
  --ink-3:#7E8593;
  --viewport-a:#26272C;
  --viewport-b:#141518;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ── header ───────────────────────────────────────────────────── */
header{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:10px 18px;border-bottom:1px solid var(--line);
  background:var(--surface-solid);z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:-.01em}
.mark{width:22px;height:22px;border-radius:6px;flex:none;display:block;
  /* the icon is already a rounded square on transparent, so it only needs a
     touch of lift to sit on either theme without a plate behind it */
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
.brand small{font-weight:500;color:var(--ink-3);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.seg{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.seg button{
  border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  font:600 12.5px/1 inherit;padding:7px 12px;border-radius:6px;transition:.14s;white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 1px 4px rgba(64,115,255,.4)}
.seg.quiet button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.spacer{flex:1}
.iconbtn{
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  border-radius:8px;padding:7px 11px;cursor:pointer;font:600 12px/1 inherit;transition:.14s;
}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}

/* ── stage ────────────────────────────────────────────────────── */
#stage{flex:1;position:relative;min-height:0;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block}

.panel{
  position:absolute;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  z-index:6;
}
.panel h4{
  font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);padding:11px 14px 0;
}

/* phase panel */
#phasePanel{top:16px;left:16px;width:246px;padding-bottom:12px}
.phase-name{padding:6px 14px 2px;font-size:15px;font-weight:700;letter-spacing:-.015em}
.targets{padding:8px 14px 2px;display:flex;flex-wrap:wrap;gap:5px}
.targets span{font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2)}
.targets span.p{background:color-mix(in srgb,var(--mint) 18%,transparent);
  border-color:color-mix(in srgb,var(--mint) 45%,transparent);color:var(--ink-1)}
.phase-cue{padding:0 14px;font-size:12.2px;color:var(--ink-2);line-height:1.4}
.track{display:flex;gap:3px;padding:11px 14px 0}
.track i{height:3px;flex:1;border-radius:2px;background:var(--line);transition:background .2s}
.track i.on{background:var(--accent)}

/* metrics panel */
#metricPanel{top:16px;right:16px;width:290px;padding-bottom:8px}
.m-row{
  display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;
  padding:8px 14px;border-top:1px solid var(--line);
}
.m-row:first-of-type{border-top:0;margin-top:6px}
.m-name{font-size:12.4px;color:var(--ink-2);line-height:1.25}
.m-name b{display:block;color:var(--ink);font-weight:600;font-size:12.6px}
.m-name span{font-size:10.5px;color:var(--ink-3)}
.m-val{font-size:14px;font-weight:700;letter-spacing:-.02em;min-width:62px;text-align:right}
.m-flag{
  width:9px;height:9px;border-radius:50%;flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
}
.ok{color:var(--mint)} .bad{color:var(--red)} .warn{color:var(--amber)}
.m-flag.ok{background:var(--mint)} .m-flag.bad{background:var(--red)} .m-flag.warn{background:var(--amber)}

#verdict{
  margin:8px 14px 4px;padding:8px 11px;border-radius:9px;
  font-size:11.6px;font-weight:600;line-height:1.35;
  background:color-mix(in srgb,var(--mint) 15%,transparent);color:var(--mint);
}
#verdict.bad{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}

/* legend */
#legend{
  position:absolute;left:16px;bottom:16px;z-index:6;
  display:flex;gap:14px;align-items:center;
  font-size:11px;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:7px 12px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
}
#legend span{display:flex;align-items:center;gap:6px}
#legend em{width:16px;height:3px;border-radius:2px;font-style:normal}

/* fault banner */
#faultBanner{
  position:absolute;left:50%;transform:translateX(-50%);top:16px;z-index:8;
  background:var(--red);color:#fff;font-size:11.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;
  padding:7px 15px;border-radius:20px;box-shadow:0 4px 16px rgba(255,77,94,.45);
  display:none;
}
#faultBanner.show{display:block}

/* ── dock ─────────────────────────────────────────────────────── */
.dock{
  border-top:1px solid var(--line);background:var(--surface-solid);
  padding:11px 18px 13px;display:flex;flex-direction:column;gap:9px;z-index:20;
}
.tl{display:flex;align-items:center;gap:13px}
.tl .t{font-size:11.5px;color:var(--ink-3);min-width:52px}
.tl .t.r{text-align:right}
#scrub{
  flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:var(--line);outline:none;cursor:pointer;
}
#scrub::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2.5px solid var(--surface-solid);
  box-shadow:0 1px 5px rgba(64,115,255,.55);cursor:pointer;
}
#scrub::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--accent);
  border:2.5px solid var(--surface-solid);cursor:pointer;
}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{
  width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:#fff;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(64,115,255,.42);transition:.14s;
}
.play:hover{transform:scale(1.05)}
.faulttoggle{
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  border-radius:8px;padding:8px 13px;cursor:pointer;font:600 12px/1 inherit;transition:.14s;
  display:flex;align-items:center;gap:7px;
}
.faulttoggle:hover{border-color:var(--ink-3);color:var(--ink)}
.faulttoggle[aria-pressed="true"]{
  background:var(--red);border-color:var(--red);color:#fff;
}
.faulttoggle i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.hint{font-size:11px;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){
  #phasePanel,#metricPanel{position:static;width:auto;margin:0}
  .panel{border-radius:0;border-left:0;border-right:0}
}
</style>

for (const [k,v] of Object.entries(EX)) Object.assign(v, P[k]);

/* ── 3. METRIC DEFINITIONS ─────────────────────────────────────
   Each reads live bone world-positions. Nothing here is a
   hardcoded string — that was the whole complaint.              */
/* "At the end of the rep" — the one condition every end-of-range check
   needs, and the thing twelve of them were guessing at.

   `S.d` is the lift's position in its OWN range: 0 at the start, 1 at the
   far end, shipped per sample by solve.js from the lift's profile. Every
   profile holds at 1 for a beat, so d >= 0.98 is that hold and nothing else.
   These checks used to be gated on hand-picked slices of the CLOCK instead
   — `S.t > 0.34 && S.t < 0.70` and so on — which is a guess at when a given
   lift arrives at its finish, and the guess was wrong on twelve of the
   fifteen. Every one of them flashed red partway through the rep for the
   crime of being partway through the rep. */
const AT_END = S => S.d >= 0.98;

const METRICS = {
  elbowAngle:{
    label:'Elbow angle', sub:'shoulder–elbow–wrist', unit:'°',
    read:P => angle3(P.shoulderR, P.elbowR, P.wristR),
    ok:v => v >= 0, fmt:v => Math.round(v)+'°',
  },
  rowTorso:{
    label:'Torso hold', sub:'stays hinged between 45° and 75°', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.chest, P.hips);
      return deg(Math.atan2(u.x, Math.max(1e-6, u.y)));
    },
    /* the whole point of a row is that this number does NOT move. Heaving
       the chest up to meet the bar is the fault, and it shows here. */
    ok:v => v >= 45 && v <= 75, fmt:v => Math.round(v)+'°',
  },
  hipTravel:{
    label:'Hip travel', sub:'hips go back, not down — over 12 cm', unit:'cm',
    read:P => -P.hips.x * 100,
    /* a hinge is defined by the hips moving BEHIND the feet. Squatting the
       weight down instead gives a small number here even though the bar
       ends up in the same place. */
    ok:(v,S) => !AT_END(S) || v >= 12, fmt:v => Math.round(v)+' cm',
  },
  elbowHeight:{
    label:'Elbow carry', sub:'upper arm above -45° from horizontal', unit:'°',
    read:P => {
      const d = new V3().subVectors(P.elbowR, P.shoulderR);
      return deg(Math.asin(clamp(d.y / (d.length() || 1e-6), -1, 1)));
    },
    /* Measured as the upper arm's ANGLE, not the elbow's height in cm. The
       rack rotates with the torso, so a raw height reading drops 10cm just
       from leaning — the angle isolates "did the elbows drop" from "did the
       lifter lean". Good reps run -15° to -36°; letting the rack collapse
       takes it past -60°. */
    ok:v => v >= -45, fmt:v => (v>=0?'+':'') + Math.round(v)+'°',
  },
  barToChest:{
    label:'Bar to chest', sub:'bar to sternum at the finish, under 17 cm', unit:'cm',
    read:P => {
      /* measure the BAR, not the grips: on a wide grip the hands are out on
         the bends and the centreline that meets the chest is 8cm higher */
      const mid = new V3().addVectors(P.handL, P.handR).multiplyScalar(0.5);
      mid.y += GRIP_DROP;
      /* upper sternum: the chest BONE sits mid-ribcage, and a pulldown
         finishes at the collarbone, not the solar plexus */
      const sternum = new V3().lerpVectors(P.chest, P.neck, 0.78);
      return mid.distanceTo(sternum) * 100;
    },
    /* only meaningful at the bottom — at the top the bar is supposed to be
       an arm's length away */
    /* the reference is the sternum BONE and the ribcage capsule is 13cm,
       so anything under ~17cm is the bar on the chest */
    ok:(v,S) => !AT_END(S) || v <= 17, fmt:v => Math.round(v)+' cm',
  },
  chestPad:{
    label:'Chest on the pad', sub:'torso stays 2-20° forward of vertical', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.chest, P.hips);
      return deg(Math.atan2(u.x, Math.max(1e-6, u.y)));
    },
    /* the pad is the whole point of the machine: it takes the torso out of
       the movement. Pulling off it means the back is swinging the weight. */
    ok:v => v >= 2 && v <= 20, fmt:v => (v>=0?'+':'') + Math.round(v)+'°',
  },
  pushLockout:{
    label:'Lockout', sub:'within 25° of straight at the bottom', unit:'°',
    read:P => 180 - angle3(P.shoulderR, P.elbowR, P.wristR),
    ok:(v,S) => !AT_END(S) || v <= 25, fmt:v => Math.round(v)+'°',
  },
  curlTop:{
    label:'Curl range', sub:'past 115° of elbow flexion at the top', unit:'°',
    read:P => 180 - angle3(P.shoulderR, P.elbowR, P.wristR),
    ok:(v,S) => !AT_END(S) || v >= 115, fmt:v => Math.round(v)+'°',
  },
  elbowPinned:{
    label:'Elbow pinned', sub:'elbow stays within 10 cm ahead of the shoulder', unit:'cm',
    read:P => (P.elbowR.x - P.shoulderR.x) * 100,
    /* The curl is ONE hinge. The moment the elbow travels forward the front
       delt is lifting the bar and the biceps are along for the ride — which
       is what a swung curl actually is. */
    ok:v => v <= 10, fmt:v => (v>=0?'+':'') + Math.round(v)+' cm',
  },
  torsoStill:{
    label:'Torso still', sub:'within 12° of vertical', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.chest, P.hips);
      return Math.abs(deg(Math.atan2(u.x, Math.max(1e-6, u.y))));
    },
    ok:v => v <= 12, fmt:v => Math.round(v)+'°',
  },
  extendRange:{
    label:'Knee extension', sub:'within 12° of straight at the top', unit:'°',
    read:P => 180 - angle3(P.hipR, P.kneeR, P.ankleR),
    ok:(v,S) => !AT_END(S) || v <= 12, fmt:v => Math.round(v)+'°',
  },
  seatBack:{
    label:'Back on the pad', sub:'torso stays within 24° of vertical', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.chest, P.hips);
      return deg(Math.atan2(-u.x, Math.max(1e-6, u.y)));
    },
    /* the only way past a load the quads cannot lift is to throw the torso
       backwards, which turns a knee movement into a whole-body swing */
    ok:v => v <= 24, fmt:v => Math.round(v)+'°',
  },
  curlRange:{
    label:'Knee flexion', sub:'past 95° at the top', unit:'°',
    read:P => 180 - angle3(P.hipR, P.kneeR, P.ankleR),
    ok:(v,S) => !AT_END(S) || v >= 95, fmt:v => Math.round(v)+'°',
  },
  hipOffPad:{
    label:'Hips on the pad', sub:'hip no more than 4 cm above the knee', unit:'cm',
    read:P => (P.hips.y - P.kneeR.y) * 100,
    /* Once the hamstrings run out, the only way left to move the roller is
       to lift the pelvis and throw it. Both ends of the thigh are on the
       same pad, so the moment the hip climbs above the knee it is off it. */
    ok:v => v <= 4, fmt:v => (v>=0?'+':'') + Math.round(v)+' cm',
  },
  heelToGlute:{
    label:'Heel to glute', sub:'under 56 cm at the top', unit:'cm',
    read:P => P.ankleR.distanceTo(P.hipR) * 100,
    ok:(v,S) => !AT_END(S) || v <= 56, fmt:v => Math.round(v)+' cm',
  },
  thighFlat:{
    label:'Thigh flat', sub:'thigh within 8° of the pad', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.kneeR, P.hipR);
      return deg(Math.asin(clamp(Math.abs(u.y) / (u.length() || 1e-6), 0, 1)));
    },
    /* the thigh is furniture in this lift: if it moves, the hip did the work */
    ok:v => v <= 8, fmt:v => Math.round(v)+'°',
  },
  flyLock:{
    label:'Elbow lock', sub:'stays between 120° and 170° all rep', unit:'°',
    read:P => angle3(P.shoulderR, P.elbowR, P.wristR),
    /* A fly is ONE hinge, at the shoulder. The elbow is set at the start and
       held — the instant it starts closing, the triceps are doing the work
       and it is a press with a longer lever. This is the whole lift in one
       number. */
    ok:v => v >= 120 && v <= 170, fmt:v => Math.round(v)+'°',
  },
  armLevel:{
    label:'Arm level', sub:'hand within 8 cm of shoulder height', unit:'cm',
    read:P => (P.handR.y - P.shoulderR.y) * 100,
    /* the arc is horizontal. Hands sinking below the shoulders means the
       load has been handed to the front delts. */
    ok:v => Math.abs(v) <= 8, fmt:v => (v>=0?'+':'') + Math.round(v)+' cm',
  },
  handSpan:{
    label:'Hand span', sub:'handles meet at the finish, under 30 cm', unit:'cm',
    read:P => Math.abs(P.handR.z - P.handL.z) * 100,
    ok:(v,S) => !AT_END(S) || v <= 30, fmt:v => Math.round(v)+' cm',
  },
  elbowTuck:{
    label:'Elbow tuck', sub:'upper arm within 25° of the sagittal plane', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.elbowR, P.shoulderR);
      const lateral = Math.abs(P.elbowR.z - P.shoulderR.z);
      return deg(Math.asin(clamp(lateral / (u.length() || 1e-6), 0, 1)));
    },
    /* what a coach means by "tuck your elbows" — how far the upper arm
       swings OUT to the side, not its angle from the torso. A row drives
       the elbow back past the ribs; letting it wing out turns the lift into
       a wide upright row and hands the work to the rear delts.

       45° was far too loose to be a check: the row peaked at 29° and read
       green the whole way while the elbows visibly winged. The rule engine
       holds this lift to 22° now, and the studio should not be reporting a
       looser standard than the build gate. */
    ok:v => v <= 25, fmt:v => Math.round(v)+'°',
  },
  rowSwing:{
    label:'Torso swing', sub:'stays between 12° back and 28° forward', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.chest, P.hips);
      return deg(Math.atan2(u.x, Math.max(1e-6, u.y)));
    },
    /* A seated row is allowed to move — about 20° forward at the stretch,
       upright at the finish. What it is not allowed to do is keep going:
       past 12° behind vertical the lower back is doing the pulling and the
       back is not. Positive = leaning forward. */
    ok:v => v >= -12 && v <= 28, fmt:v => (v>=0?'+':'') + Math.round(v)+'°',
  },
  barToBody:{
    label:'Bar to body', sub:'bar reaches the lower ribs, under 22 cm', unit:'cm',
    read:P => {
      const mid = new V3().addVectors(P.handL, P.handR).multiplyScalar(0.5);
      const ribs = new V3().lerpVectors(P.hips, P.chest, 0.85);
      return mid.distanceTo(ribs) * 100;
    },
    /* This replaced `barOverFoot` on the barbell row, which was flashing red
       for 14 samples of every rep and was right to, in the sense that the
       number really was 14cm — and wrong, because that is not a fault. The
       lifter is hinged 48°, so the shoulders are 14cm in front of the
       mid-foot and a hanging bar is 1mm under the shoulder. It could not be
       anywhere else. "Bar over mid-foot" is a balance cue for lifts done
       STANDING; asking it of a hinge is asking a question that has no good
       answer. What a row is actually judged on is whether the bar reaches
       the body, so that is what it reads now. */
    ok:(v,S) => !AT_END(S) || v <= 22, fmt:v => Math.round(v)+' cm',
  },
  handleToRibs:{
    label:'Handle to ribs', sub:'handle reaches the lower ribs, under 24 cm', unit:'cm',
    read:P => {
      const mid = new V3().addVectors(P.handL, P.handR).multiplyScalar(0.5);
      /* the lower ribs, measured ON the torso — so leaning away from the
         handle counts as not finishing the pull, which is exactly what
         the swing is doing */
      const ribs = new V3().lerpVectors(P.hips, P.chest, 0.85);
      return mid.distanceTo(ribs) * 100;
    },
    ok:(v,S) => !AT_END(S) || v <= 24, fmt:v => Math.round(v)+' cm',
  },
  pullLean:{
    label:'Lean back', sub:'torso from vertical, under 20°', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.chest, P.hips);
      return deg(Math.atan2(-u.x, Math.max(1e-6, u.y)));
    },
    /* a pulldown leans back a little on purpose. Past about 20° the lats
       stop being the prime mover and it turns into a seated row. */
    ok:v => v <= 20, fmt:v => Math.round(v)+'°',
  },
  elbowFlare:{
    label:'Elbow flare', sub:'abduction out of the sagittal plane, under 78°', unit:'°',
    read:P => {
      /* what a coach means by flare is how far the elbow is out to the SIDE,
         not its total angle from the torso axis — at bench lockout the arm is
         legitimately perpendicular to a supine torso. */
      const u = new V3().subVectors(P.elbowR, P.shoulderR);
      const lateral = Math.abs(P.elbowR.z - P.shoulderR.z);
      return deg(Math.asin(clamp(lateral / (u.length() || 1e-6), 0, 1)));
    },
    ok:v => v <= 78, fmt:v => Math.round(v)+'°',
  },
  wristStack:{
    label:'Wrist stack', sub:'forearm vertical at the bottom', unit:'cm',
    read:P => Math.hypot(P.wristR.x - P.elbowR.x, P.wristR.z - P.elbowR.z) * 100,
    /* only meaningful where the forearm is supposed to be vertical — at
       lockout a wide grip legitimately angles the forearm outward */
    ok:(v,S) => !AT_END(S) || v <= 9, fmt:v => v.toFixed(1)+' cm',
  },
  barOverFoot:{
    label:'Bar over mid-foot', sub:'horizontal offset from the ankle', unit:'cm',
    read:(P,S) => (S.bar.x - ((P.ankleR.x + P.ankleL.x)/2 + 0.045)) * 100,
    ok:(v,S) => S.t < 0.30 || Math.abs(v) <= 11, fmt:v => (v>=0?'+':'')+v.toFixed(1)+' cm',
  },
  barJPath:{
    label:'Bar path', sub:'a bench press bar travels a shallow J, 2\u201310 cm', unit:'cm',
    read:(P,S) => Math.abs(S.bar.x - S.barStartX) * 100,
    ok:(v,S) => !AT_END(S) || (v >= 2 && v <= 10),
    fmt:v => v.toFixed(1)+' cm',
  },
  barDrift:{
    label:'Bar drift', sub:'horizontal travel from start', unit:'cm',
    read:(P,S) => (S.bar.x - S.barStartX) * 100,
    ok:v => Math.abs(v) <= 9, fmt:v => (v>=0?'+':'')+v.toFixed(1)+' cm',
  },
  squatDepth:{
    label:'Depth', sub:'hip crease vs. knee', unit:'cm',
    read:P => (P.hips.y - P.kneeR.y) * 100,
    /* depth only means anything at the bottom of the rep */
    ok:(v,S) => !AT_END(S) || v <= 2,
    fmt:v => (v>=0?'+':'')+v.toFixed(1)+' cm',
  },
  kneeValgus:{
    label:'Knee tracking', sub:'knee vs. foot, seen from the front', unit:'cm',
    /* measured against the FOOT, not the hip-ankle line — the line angles
       outward with a wide stance, so a knee that is visibly collapsing can
       still read as neutral against it. From the front, foot is the datum. */
    read:P => (P.ankleR.z - P.kneeR.z) * 100,
    ok:(v,S) => S.d < 0.15 || v <= 2,
    fmt:v => (v > 0 ? 'in ' : 'out ') + Math.abs(v).toFixed(1) + ' cm',
  },
  spineNeutral:{
    label:'Spine', sub:'hips–spine–chest, 180° = neutral', unit:'°',
    read:P => angle3(P.hips, P.spine, P.chest),
    ok:v => v >= 158, fmt:v => Math.round(v)+'°',
  },
  torsoAngle:{
    label:'Torso angle', sub:'from vertical', unit:'°',
    read:P => {
      const t = new V3().subVectors(P.chest, P.hips).normalize();
      return deg(Math.acos(clamp(t.dot(new V3(0,1,0)), -1, 1)));
    },
    ok:v => v >= 0, fmt:v => Math.round(v)+'°',
  },
  hipHeight:{
    label:'Hip height', sub:'above the floor', unit:'cm',
    read:P => P.hips.y * 100,
    ok:v => v >= 0, fmt:v => Math.round(v)+' cm',
  },
  /* Where the arc has to FINISH. A straight-arm pulldown that stops with
     the bar still out in front never reached the lats' shortened position. */
  sweepDown:{
    label:'Sweep', sub:'arm within 20° of vertical at the finish', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.handR, P.shoulderR);
      return deg(Math.acos(clamp(-u.y / (u.length() || 1e-6), -1, 1)));
    },
    ok:(v,S) => !AT_END(S) || v <= 20, fmt:v => Math.round(v)+'°',
  },
  /* The adductor's mirror of it: this machine is judged at the CLOSED end,
     not the open one. Stopping short is the whole failure mode. */
  adductClose:{
    label:'Squeeze', sub:'knees within 14° of together at the finish', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.kneeR, P.hipR);
      return deg(Math.asin(clamp(Math.abs(u.z) / (u.length() || 1e-6), 0, 1)));
    },
    ok:(v,S) => !AT_END(S) || v <= 14, fmt:v => Math.round(v)+'°',
  },
  /* The whole lift in one number: how far the thigh has swung out of the
     sagittal plane. Everything else on this machine is furniture. */
  abductRange:{
    label:'Abduction', sub:'thigh out of the sagittal plane, over 30° at the finish', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.kneeR, P.hipR);
      return deg(Math.asin(clamp(Math.abs(u.z) / (u.length() || 1e-6), 0, 1)));
    },
    ok:(v,S) => !AT_END(S) || v >= 30, fmt:v => Math.round(v)+'°',
  },
  /* Three numbers for three things that all have to happen at once, and a
     face pull done wrong loses exactly one of them. */
  elbowHigh:{
    label:'Elbow height', sub:'elbow level with the shoulder at the finish', unit:'cm',
    /* Measured against the SHOULDER, not the hand. The hand finishes at the
       ear and the elbow does not — the forearm points up and in, so an
       elbow "above the hand" is not what this lift looks like. Drop the
       elbow below the shoulder, though, and it stops being a face pull:
       the lat takes it and the rear delt does nothing. */
    read:P => (P.elbowR.y - P.shoulderR.y) * 100,
    ok:(v,S) => !AT_END(S) || v >= -4,
    fmt:v => (v >= 0 ? '+' : '') + v.toFixed(1) + ' cm',
  },
  faceHeight:{
    label:'Pull height', sub:'hands level with the face at the finish', unit:'cm',
    read:P => (P.handR.y - P.shoulderR.y) * 100,
    ok:(v,S) => !AT_END(S) || v >= 8,
    fmt:v => (v >= 0 ? '+' : '') + Math.round(v) + ' cm',
  },
  bladeSqueeze:{
    label:'Blades', sub:'shoulder joints travel back, over 4 cm', unit:'cm',
    /* scapular retraction, measured rather than asserted: the joint's own
       distance behind the mid-line of the ribcage. It is the half of the
       lift a still frame cannot show. */
    read:P => (P.chest.x - (P.shoulderR.x + P.shoulderL.x) / 2) * 100,
    /* 4cm, and that is not a soft threshold — it is what the clavicle can
       actually give. The joint swings on a 13.5cm bone, so a hard squeeze
       moves it about 4cm on a 165cm figure and no cue moves it further. */
    ok:(v,S) => !AT_END(S) || v >= 4, fmt:v => v.toFixed(1) + ' cm',
  },
  /* The one thing a leg press can get badly wrong at the finish: snapping
     the knee straight with a stack on it. Extended is the goal, locked is
     the injury, and 25 degrees of bend is the difference. */
  pressLockout:{
    label:'Knee at lockout', sub:'extended but not locked — 148° to 175°', unit:'°',
    read:P => angle3(P.hipR, P.kneeR, P.ankleR),
    ok:(v,S) => !AT_END(S) || (v >= 148 && v <= 175), fmt:v => Math.round(v)+'°',
  },
  /* A lateral raise is ONE hinge, like a fly — flyLock already says the
     elbow may not change. These two say where the arc has to STOP. */
  raiseTop:{
    label:'Raise height', sub:'hand level with the shoulder at the top', unit:'cm',
    read:P => (P.handR.y - P.shoulderR.y) * 100,
    /* above the shoulder is not more range, it is the traps taking over —
       which is exactly what the fault variant shows */
    ok:(v,S) => !AT_END(S) || Math.abs(v) <= 6,
    fmt:v => (v >= 0 ? '+' : '') + Math.round(v) + ' cm',
  },
  elbowLead:{
    label:'Elbow lead', sub:'elbow at or above the hand at the top', unit:'cm',
    read:P => (P.elbowR.y - P.handR.y) * 100,
    ok:(v,S) => !AT_END(S) || v >= -2,
    fmt:v => (v >= 0 ? '+' : '') + v.toFixed(1) + ' cm',
  },
  /* A dip's depth is not a distance, it is a RELATIONSHIP: the shoulder
     has to finish below the elbow. Measured in cm because that is what
     the difference between a full rep and a half rep looks like. */
  dipDepth:{
    label:'Depth', sub:'shoulder below the elbow at the bottom', unit:'cm',
    read:P => (P.elbowR.y - P.shoulderR.y) * 100,
    ok:(v,S) => !AT_END(S) || v >= 0,
    fmt:v => (v >= 0 ? '+' : '') + v.toFixed(1) + ' cm',
  },
  /* and the direction that separates a dip from an upright press: the
     elbow travels BEHIND the shoulder, not out beside it. */
  elbowBack:{
    label:'Elbow path', sub:'elbow behind the shoulder at the bottom', unit:'cm',
    read:P => (P.shoulderR.x - P.elbowR.x) * 100,
    ok:(v,S) => !AT_END(S) || v >= 12, fmt:v => Math.round(v)+' cm',
  },
  /* the whole point of a hip thrust: the hip, not the knee, finishes the
     rep. Under 168° at the top and the glutes never shortened. */
  hipLockout:{
    label:'Hip extension', sub:'trunk–hip–thigh, over 158° at the top', unit:'°',
    read:P => angle3(P.chest, P.hipR, P.kneeR),
    /* 158, not 180: the chest joint is on the midline and the hip and
       knee are 9.5cm out, so a dead-straight hip measures 166 here. */
    ok:(v,S) => !AT_END(S) || v >= 158, fmt:v => Math.round(v)+'°',
  },
  /* and the foot placement that makes it one: shins vertical at lockout.
     Feet too close and it becomes a quad press; too far and a hamstring
     bridge. Measured, not asserted. */
  shinVertical:{
    label:'Shin', sub:'vertical at lockout, under 12°', unit:'°',
    read:P => {
      const u = new V3().subVectors(P.kneeR, P.ankleR).normalize();
      return deg(Math.acos(clamp(Math.abs(u.y), -1, 1)));
    },
    ok:(v,S) => !AT_END(S) || v <= 12, fmt:v => Math.round(v)+'°',
  },
};
function angle3(a,b,c){
  const u = new V3().subVectors(a,b).normalize();
  const v = new V3().subVectors(c,b).normalize();
  return deg(Math.acos(clamp(u.dot(v), -1, 1)));
}

/* muscle-group gradient — lifted from Theme.muscleGroupGradient */
const GRAD = {
  chest:[0xFF9900,0xFF4D00], back:[0x3399FF,0x0066E6],
  legsQuad:[0x33E680,0x00B34D], shoulders:[0xB34DFF,0x801AE6],
  biceps:[0xFF6680,0xE6334D], triceps:[0xFF4D66,0xE61A33],
  core:[0xFFCC00,0xE69900], traps:[0x4D80FF,0x1A4DE6],

};

/* ── 4. SCENE ──────────────────────────────────────────────────
   Neutral three-point light. No coloured rim, no fog. An anatomy
   reference has to read as shape, not as mood.                  */
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.2; controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI/2 - 0.03;
controls.target.set(0, 0.95, 0);

const key  = new THREE.DirectionalLight(0xffffff, 0.72);

function capsuleGeom(r, len, seg=10){
  const half = len/2, pts=[];
  for(let i=0;i<=seg;i++){ const a=-Math.PI/2+(Math.PI/2)*(i/seg); pts.push(new THREE.Vector2(Math.cos(a)*r, -half+Math.sin(a)*r)); }
  for(let i=0;i<=seg;i++){ const a=(Math.PI/2)*(i/seg);            pts.push(new THREE.Vector2(Math.cos(a)*r,  half+Math.sin(a)*r)); }
  return new THREE.LatheGeometry(pts, 22);
}
/* A capsule that TAPERS. capsuleGeom() gives both ends the same radius, and
   a plain CylinderGeometry gives you flat caps and a hard rim — which is
   exactly what stuck out of the lats: every other part of this body is a
   lathe with rounded ends, so the one cylinder read as a loose sheet. */
function spindleGeom(rBot, rTop, len, seg=10){
  const half = len/2, pts = [];
  for (let i=0;i<=seg;i++){ const a = -Math.PI/2 + (Math.PI/2)*(i/seg);
    pts.push(new THREE.Vector2(Math.cos(a)*rBot, -half + Math.sin(a)*rBot)); }
  for (let i=0;i<=seg;i++){ const a = (Math.PI/2)*(i/seg);
    pts.push(new THREE.Vector2(Math.cos(a)*rTop,  half + Math.sin(a)*rTop)); }
  return new THREE.LatheGeometry(pts, 24);
}

/* a limb mesh hanging from its bone down to the child joint */
function limb(bone, length, rTop, rBot, mat){
  const g = capsuleGeom((rTop+rBot)/2, Math.max(0.001, length - (rTop+rBot)/2), 8);
  const m = new THREE.Mesh(g, mat || bodyMat);
  m.position.y = -length/2;
  m.castShadow = true; m.receiveShadow = true;
  bone.add(m);
  return m;
}
function blob(bone, rx, ry, rz, pos, mat){
  const g = new THREE.SphereGeometry(1, 22, 18); g.scale(rx, ry, rz);
  const m = new THREE.Mesh(g, mat || bodyMat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.castShadow = true; m.receiveShadow = true;
  bone.add(m);
  return m;
}

/* Lats, as their own meshes — and as the shape that makes the V.

   flattened front-to-back, and tilted so the top swings out under the
   arm. Widest point of the back, and it gets there high up. */
function latMesh(side){                       // -1 = left, +1 = right
  const g = spindleGeom(0.020, 0.062, 0.215);  // narrow at the waist, broad up top
  g.scale(0.50, 1, 1);                         // a sheet, not a sausage

   been single limb capsules, which is fine until a lift targets the BACK of

   which is the muscle that is resting. Same reasoning that split the lats
   out of the back. Tapered sheets, flattened front-to-back, sitting on the
   posterior side (local -X is behind the leg). */
function backOfLimb(bone, rBot, rTop, len, x, y, flat){
  const g = spindleGeom(rBot, rTop, len);

/* The UPPER back — a PATCH OF THE CHEST'S OWN SURFACE, not a shape sitting
   on top of it. The first attempt added tapered sheets the way the lats and
   hamstrings are built, and it looked like a growth: those two work because
   a lat and a hamstring genuinely stand proud of the limb, and the upper
   back does not — it is the same surface, differently coloured.

   So this is the chest ellipsoid re-cut: the same radii and the same origin,
   0.6% larger to stay off the original, clipped to the rear-upper quadrant
   by sphere angles. It lies exactly on the body and reads as colour.

   `backL/backR` remains the mid and lower back, on the SPINE bone. */
function surfacePatch(bone, r, pos, phi0, phiLen, th0, thLen){
  const g = new THREE.SphereGeometry(1, 20, 14, phi0, phiLen, th0, thLen);
  g.scale(r[0] * 1.006, r[1] * 1.006, r[2] * 1.006);
  const m = new THREE.Mesh(g, bodyMat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.receiveShadow = true;
  bone.add(m);
  return m;
}

/* ── the decline bench ──────────────────────────────────────────
   Built from the SAME angle and root position the solver uses, not from a
   second set of numbers that look about right — a pad authored independently
   is a pad the figure floats above. The group is parked at the hips and
   rotated by the decline, so everything inside is in body-line coordinates:
   local +X runs down the bench toward the legs, local +Y is off the pad. */
const DEC_ANGLE = 22, DEC_AT = new V3(0.24, 0.86, 0);

{
  const bed = new THREE.Group();
  bed.position.copy(DEC_AT);
  bed.rotation.z = rad(DEC_ANGLE);
  declineProp.add(bed);

  const pad = new THREE.Mesh(new THREE.BoxGeometry(1.24, 0.085, 0.30), benchMat);
  pad.position.set(-0.085, -0.173, 0);
  pad.castShadow = pad.receiveShadow = true; bed.add(pad);

  /* The rollers the legs brace against — this is what holds a lifter on a
     decline bench, and without them the figure reads as falling head-first.

     Head-down, the body wants to slide toward the head, so the shins press
     into pads sitting on the HEAD side of them. That is the placement rule,
     and it is worth stating because the first two attempts ignored it: the
     rollers went where leg pads *look* like they belong and passed 6cm and
     10cm THROUGH the leg. These sit a shin-radius plus a roller-radius off
     the solved shin axis, so they touch it and clear the thigh by 5cm. */
  const SHIN_PADS = [[0.415, -0.120], [0.485, -0.300]];
  for (const z of [-0.135, 0.135]) {
    for (const at of SHIN_PADS) {
      const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.19, 14), benchMat);
      roll.rotation.x = Math.PI / 2;
      roll.position.set(at[0], at[1], z);

    post.position.set(0.450, -0.230, z);
    post.rotation.z = -0.38;
    post.castShadow = true; bed.add(post);

  /* the frame stands on the FLOOR, so it is built in world space — inside the
     rotated group its uprights would lean with the pad */
  const foot = (x, top) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.07, top, 0.07), steelMat);
    leg.position.set(x, top / 2, 0); leg.castShadow = true; declineProp.add(leg);
    const ft = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.035, 0.46), steelMat);
    ft.position.set(x, 0.018, 0); ft.castShadow = true; declineProp.add(ft);
  };

}

/* a cylinder spanning two points — the only honest way to build a bent bar.
   Positioning by rotation.set() is what left the angled ends detached from
   the shaft and pointing at the ceiling. */
function segment(a, b, r, mat, parent){
  const d = new V3().subVectors(b, a), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 14), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new V3(0,1,0), d.clone().normalize());
  m.castShadow = true; parent.add(m);
  return m;
}

/* stretch a unit-height cylinder between two points */
const _spanD = new V3();
function spanTo(mesh, a, b){
  _spanD.subVectors(b, a);
  const len = _spanD.length() || 1e-4;
  mesh.position.copy(a).addScaledVector(_spanD, 0.5);
  mesh.quaternion.setFromUnitVectors(new V3(0,1,0), _spanD.clone().divideScalar(len));
  mesh.scale.set(1, len, 1);
}

/* ── 8. POSING ─────────────────────────────────────────────────*/
function cueAt(ex, t){
  let c = ex.cues[0], i = 0;
  ex.cues.forEach((q, qi) => { if (t >= q[0]) { c = q; i = qi; } });
  return { label:c[1], cue:c[2], index:i };
}
/* Poses ship as QUATERNIONS and are slerped. Euler is fine to solve in; it
   is not fine to interpolate — near a gimbal, two valid triples describe the
   same rotation and lerping between them spins the limb the long way round.
   That is exactly what wrecked the overhead press. */
const _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion();
const _pool = {}; for (const n in SKELETON) _pool[n] = new THREE.Quaternion();
function poseAt(ex, t, useFault){
  const S = (useFault && ex.faultSamples) ? ex.faultSamples : ex.samples;
  let i = 0; while (i < S.length - 2 && t > S[i+1].t) i++;
  const a = S[i], b = S[i+1] || S[i];
  const p = (b.t === a.t) ? 0 : clamp((t - a.t) / (b.t - a.t), 0, 1);
  const q = {};
  for (const bone in a.q){
    _qa.fromArray(a.q[bone]);
    _qb.fromArray(b.q[bone] || a.q[bone]);
    q[bone] = _pool[bone].copy(_qa).slerp(_qb, p);   // r128-safe; slerpQuaternions returns undefined here
  }
  return { q,
    hips:[ a.hips[0] + (b.hips[0]-a.hips[0])*p, a.hips[1] + (b.hips[1]-a.hips[1])*p ],
    /* how far through its OWN range the lift is — 0 at the start position,
       1 at the far end. Metrics gate on this, not on the clock. */
    d: (a.d ?? 0) + ((b.d ?? 0) - (a.d ?? 0)) * p,
    phase: cueAt(ex, t) };
}
/* A fault is authored in degrees, so it round-trips through Euler. Fault
   poses are static offsets on joints far from any gimbal, so that is safe. */
const _e = new THREE.Euler(0,0,0,'XYZ');
function addFault(P, delta){
  for (const [bone, d] of Object.entries(delta || {})){
    const q = P.q[bone]; if (!q) continue;
    _e.setFromQuaternion(q, 'XYZ');
    _e.set(_e.x + rad(d.rx||0), _e.y + rad(d.ry||0), _e.z + rad(d.rz||0), 'XYZ');
    q.setFromEuler(_e);
  }
}
function applyPose(ex, P){
  root.position.fromArray(ex.root.pos);
  root.rotation.set(rad(ex.root.rot[0]), rad(ex.root.rot[1]), rad(ex.root.rot[2]));
  for (const n in SKELETON){
    const o = B[n], d = SKELETON[n].offset;
    if (n === 'hips') o.position.set(P.hips[0], P.hips[1], 0);
    else o.position.set(d[0], d[1], d[2]);
    if (P.q[n]) o.quaternion.copy(P.q[n]); else o.quaternion.identity();
  }
  root.updateMatrixWorld(true);
}
function worldPoints(){
  const P = {};
  for (const n in B) P[n] = B[n].getWorldPosition(new V3());
  return P;
}

/* Which mesh a chip NAMES. The chips and the tinted meshes are two lists
   that mean the same thing, and they have drifted apart twice now — once
   when a rename left every upper arm untinted, and once when the deadlift
   claimed "Hamstrings" while lighting up the quads, because no hamstring
   mesh existed yet. This asserts they agree: every PRIMARY chip must have
   its mesh in the tint list. Runs once, at load, and shouts in the console. */
const CHIP_MESH = {
  'Pectorals':['chest'], 'Quadriceps':['quadL','quadR'], 'Glutes':['gluteL','gluteR'],
  'Hamstrings':['hamL','hamR'], 'Calves':['calfL','calfR'], 'Lats':['latL','latR'],
  'Mid-back':['backL','backR'], 'Spinal erectors':['backL','backR'],
  'Upper back':['upperBackL','upperBackR'],
  'Deltoids':['deltL','deltR'], 'Front deltoids':['deltL','deltR'],
  'Rear deltoids':['deltL','deltR'], 'Rear delts':['deltL','deltR'],
  'Biceps':['upperArmL','upperArmR'], 'Triceps':['upperArmL','upperArmR'],
  'Forearms':['foreL','foreR'],
};
for (const [k,v] of Object.entries(EX)){
  for (const chip of (v.targets||{}).primary || []){
    const want = CHIP_MESH[chip];
    if (!want) continue;                       // a chip with no mesh to light
    for (const m of want)
      if (!(v.muscles||[]).includes(m))
        console.error(`${k}: chip "${chip}" but ${m} is not tinted`);
  }
}

function applyMuscleTint(){
  for (const [k,mesh] of Object.entries(tintable)){

    mesh.material = (ex.muscles || []).includes(k)
      ? (mesh.userData.tintMat ||= new THREE.MeshStandardMaterial({roughness:0.55, metalness:0.03}))
      : bodyMat;
  }
}

/* ── 11. LOOP ──────────────────────────────────────────────────*/
const clock = new THREE.Clock();
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}
addEventListener('resize', resize);

function frame(){
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (playing){
    t += dt * speed / ex.duration;
    if (t >= 1){ t = 0; tracePts.length = 0; }
    scrub.value = t * 1000;
  }

  const P0 = poseAt(ex, t, faultOn);
  const phase = P0.phase;
  if (faultOn && !ex.faultSamples && ex.fault && t >= (ex.fault.from ?? 0))
    addFault(P0, ex.fault.delta);
  applyPose(ex, P0);

  const P = worldPoints();

  /* bar follows the hands — the bar path is an OUTPUT of the pose,
     never a hardcoded curve. If the pose is right the path is right. */
  const mid = new V3().addVectors(P.handL, P.handR).multiplyScalar(0.5);
  /* Build a full basis rather than swinging +Z onto the hand axis. The hand
     axis is very nearly the bar's own -Z, and setFromUnitVectors between
     near-antiparallel vectors picks an ARBITRARY perpendicular to spin
     about — invisible on a symmetric barbell, but it flips an asymmetric
     lat bar upside down. */
  const axis = new V3().subVectors(P.handR, P.handL).normalize();
  const fwd  = new V3().crossVectors(new V3(0,1,0), axis).normalize();
  const upv  = new V3().crossVectors(axis, fwd).normalize();
  bar.position.copy(mid);
  bar.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fwd, upv, axis));
  bar.visible    = ex.equipment === 'barbell';
  latBar.visible = ex.equipment === 'latbar';
  latBar.quaternion.copy(bar.quaternion);
  /* the hands are on the bends, so the bar rides above the hand midpoint */
  latBar.position.copy(bar.position).addScaledVector(upv, GRIP_DROP);
  /* The V-handle is placed in the PALMS, not on the hand bones. Every other
     piece of equipment is a long bar where a 3cm offset is invisible; a
     handle this small sits visibly on top of the fists instead of in them. */
  pushBar.visible = ex.equipment === 'pushbar';
  pushBar.quaternion.copy(bar.quaternion);
  pushBar.position.copy(bar.position);
  /* The abductor's pads and footplates, solved from the LEG. The pad rides
     the outside of the thigh at the knee: out along the thigh's own
     horizontal normal by a thigh radius plus half a pad, and turned by the
     same angle so its face lies flat on the leg rather than cornering into
     it. The arm and the footplate follow from there. */
  if (ex.machine === 'abductor' || ex.machine === 'adductor'){
    const PIV = new V3(0.30, 0.300, 0);
    /* the sign that turns one machine into the other: outward onto the
       outer thigh, or inward between the knees */
    const side = ex.machine === 'adductor' ? -1 : 1;
    for (let i = 0; i < 2; i++){
      const sg = i ? 1 : -1;
      const hip = i ? P.hipR : P.hipL, knee = i ? P.kneeR : P.kneeL;
      const ank = i ? P.ankleR : P.ankleL;
      /* the thigh flattened into the horizontal plane, and its outward
         normal there — the direction the pad presses along */
      const tx = knee.x - hip.x, tz = knee.z - hip.z;
      const tl = Math.hypot(tx, tz) || 1e-6;
      const nx = -tz / tl * sg, nz = tx / tl * sg;          // outward, horizontal
      const off = side * (0.076 + 0.0375);                    // thigh radius + half pad
      _abPad[i].position.set(knee.x + nx*off, knee.y, knee.z + nz*off);
      _abPad[i].rotation.set(0, Math.atan2(nx, nz), 0);
      const base = new V3(knee.x + nx*off, PIV.y, knee.z + nz*off);
      spanTo(_abArm[i*2],     new V3(PIV.x, PIV.y, sg*0.055), base);
      spanTo(_abArm[i*2 + 1], base, _abPad[i].position);
      /* the PEDAL, and its top is the sole's own height: the foot is
         0.088 above its sole, the plate is 0.045 thick, so the plate's
         centre is 0.1105 under the ankle joint and the foot lands ON it
         rather than through it or hovering over it. */
      _abFoot[i].position.set(ank.x + 0.050, ank.y - 0.1105, ank.z);
      _abFoot[i].rotation.set(0, Math.atan2(nx, nz), 0);
      /* the stalk that hangs the pedal off the swing arm — without it the
         feet are resting on something with no visible attachment */
      spanTo(_abStalk[i], _abFoot[i].position,
             new V3(knee.x + nx*off, ank.y - 0.1105, knee.z + nz*off));
    }
  }

  /* The rope, solved from the two hands rather than animated beside them.
     The clip lies on the perpendicular bisector of the hands — that is what
     makes the two strands equal lengths — pushed toward the pulley by
     however much the fixed strand length has left over once the hands have
     spread. So the splay is an OUTPUT: hands together, the clip is 35cm out
     and the rope is nearly straight; hands at the ears, it is 16cm out and
     the rope is a wide V. Nothing decides that but the hands. */
  if (ex.equipment === 'rope'){
    _palmL.set(0.008,-0.035,0); B.handL.localToWorld(_palmL);
    _palmR.set(0.008,-0.035,0); B.handR.localToWorld(_palmR);
    _rMid.addVectors(_palmL, _palmR).multiplyScalar(0.5);
    _rAx.subVectors(_palmR, _palmL);
    const half = _rAx.length() * 0.5;
    _rAx.normalize();
    /* toward the pulley, with the component along the hand axis removed:
       anything else would make one strand longer than the other */
    _rU.subVectors(FACE_PULLEY, _rMid);
    _rU.addScaledVector(_rAx, -_rU.dot(_rAx));
    if (_rU.lengthSq() < 1e-9) _rU.set(1, 0, 0);
    _rU.normalize();
    const out = Math.sqrt(Math.max(0.0025, ROPE_STRAND*ROPE_STRAND - half*half));
    _ropeClip.copy(_rMid).addScaledVector(_rU, out);
    spanTo(_ropeStrand[0], _ropeClip, _palmL);
    spanTo(_ropeStrand[1], _ropeClip, _palmR);
    spanTo(_ropeStrand[2], _ropeClip, _ropeClip.clone().addScaledVector(_rU, 0.055));  // ferrule
    _ropeStrand[3].position.copy(_ropeClip).addScaledVector(_rU, 0.075);               // clip ring
    _ropeStrand[3].quaternion.setFromUnitVectors(new V3(0,1,0), _rU);
    _ropeStrand[4].position.copy(_palmL);
    _ropeStrand[5].position.copy(_palmR);
  }

  /* the footplate: the one support surface in the rig that MOVES, so it is
     solved from the pose like the leg curl's roller arm rather than parked.
     The face sits an ankle-height in front of the ankle joints — that is
     where the sole is — and the whole plate is raked back by the same
     angle the solver pitched the foot to. */
  if (ex.machine === 'legpress'){
    const ax = (P.ankleL.x + P.ankleR.x) / 2;
    const rake = rad(90 - 82);                       // matches frame()'s footPitch
    _lpPlate.position.set(ax + 0.088 + 0.030, LP_FOOT_Y + 0.055, 0);
    _lpPlate.rotation.z = -rake;
    for (const [car, z] of _lpCar) car.position.set(ax + 0.118, 0.235, z);
  }

  /* each dumbbell in its own fist, taking its own hand's orientation —
     the one implement in the rig that is not built from the pair */
  if(ex.equipment === 'singleDumbbell') extensionWeight.position.copy(P.handL).add(P.handR).multiplyScalar(0.5);
  for (const S of ['L','R']){
    const g = dumbbells[S];
    g.visible = ex.equipment === 'dumbbells';
    if (!g.visible) continue;
    const palm = S === 'L' ? _palmL : _palmR;
    palm.set(0.008, -0.035, 0); B['hand'+S].localToWorld(palm);
    g.position.copy(palm);
    g.quaternion.copy(B['hand'+S].getWorldQuaternion(_dbQ));
  }
  vHandle.visible = ex.equipment === 'vhandle';
  if (vHandle.visible){
    /* into the fist, not onto the hand BONE: the palm mesh sits ~3.5cm
       further down the limb, and the offset runs along the bone's own -Y so
       it is unaffected by the grip roll. */
    _palmL.set(0.008,-0.035,0); B.handL.localToWorld(_palmL);
    _palmR.set(0.008,-0.035,0); B.handR.localToWorld(_palmR);
    vHandle.position.copy(_palmL).add(_palmR).multiplyScalar(0.5);
    /* The handle is a rigid object hanging on a cable: its grip axis is
       vertical and STAYS vertical. Building its basis from the hands would
       let it roll with them, which is the artefact this is fixing. */
    const ax2 = new V3().subVectors(_palmR, _palmL).setY(0).normalize();
    const up2 = new V3(0,1,0);
    const fw2 = new V3().crossVectors(up2, ax2).normalize();
    vHandle.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fw2, up2, ax2));
    _vClip.copy(vHandle.position).addScaledVector(fw2, V_CLIP);
  }
  /* the cable is an output too: it runs from the handle's clip to the
     pulley, so if the pose is right the cable angle is right, automatically */
  /* the pec deck is a linkage, not a cable machine — its arms ARE the load path */
  cable.visible = ex.machine === 'pulldown' || ex.machine === 'row'
              || ex.machine === 'tower'     || ex.machine === 'facepull';
  if (cable.visible){
    const ca = cableGeo.attributes.position.array;
    /* where the cable clips: the lat bar's swivel, or the V-handle's apex —
       never the lifter's hands */
    const clip = new V3();
    const pull = ex.machine === 'row'      ? LOW_PULLEY
               : ex.machine === 'tower'    ? HIGH_PULLEY
               : ex.machine === 'facepull' ? FACE_PULLEY : PULLEY;
    /* the rope clips to the cable at its own ring, not at the hands — which
       is the only reason the cable stays straight while the rope splays */
    if (ex.equipment === 'rope') clip.copy(_ropeClip).addScaledVector(_rU, 0.095);
    else if (ex.equipment === 'vhandle') clip.copy(_vClip);
    else if (ex.equipment === 'pushbar') clip.copy(bar.position).addScaledVector(upv, PB_CLIP);
    else clip.set(latBar.position.x, latBar.position.y + 0.055, latBar.position.z);
    ca[0]=clip.x; ca[1]=clip.y; ca[2]=clip.z;
    ca[3]=pull.x; ca[4]=pull.y; ca[5]=pull.z;
    cableGeo.attributes.position.needsUpdate = true;
  }

  /* the leg curl's roller arm, solved from the pose: the pivot is the knee,
     the arm is the shin's own length, and the roller rides the ankle on the
     side the leg is pushing into. */
  if (ex.machine === 'legcurl' || ex.machine === 'legext'){
    const curl = ex.machine === 'legcurl';
    const ARM = curl ? _lcArm : _leArm, ROLL = curl ? _lcRoll : _leRoll;
    const kx = (P.kneeL.x + P.kneeR.x)/2, ky = (P.kneeL.y + P.kneeR.y)/2;
    const ax = (P.ankleL.x + P.ankleR.x)/2, ay = (P.ankleL.y + P.ankleR.y)/2;
    const sx = ax - kx, sy = ay - ky, sl = Math.hypot(sx, sy) || 1e-4;
    /* perpendicular to the shin, on the side the ankle is travelling toward —
       the Achilles on a curl, the front of the shin on an extension. One
       sign is the whole difference between the two machines. */
    const sg = ex.rollerSide || 1;
    const rx = ax + sg*(sy/sl)*0.098, ry = ay - sg*(sx/sl)*0.098;
    ROLL[0].position.set(rx, ry, 0);
    ROLL[1].position.set(rx, ry, 0);
    for (let i = 0; i < 2; i++){
      const z = i ? 0.30 : -0.30;
      spanTo(ARM[i], new V3(kx, ky, z), new V3(rx, ry, z));
    }
  }

  /* the pec deck's arms, solved from the pose: pivot over the shoulder,
     boom out to the hand, handle hanging vertically off the end */
  pecArms.visible = ex.equipment === 'pecarms';
  if (pecArms.visible){
    const hands = [P.handL, P.handR], shoulders = [P.shoulderL, P.shoulderR];
    for (let i = 0; i < 2; i++){
      const sh = shoulders[i], hd = hands[i];
      spanTo(_pecShaft[i], new V3(sh.x, PEC_BOOM_Y, sh.z), new V3(sh.x, PEC_PIVOT_Y, sh.z));
      spanTo(_pecBoom[i],  new V3(sh.x, PEC_BOOM_Y, sh.z), new V3(hd.x, PEC_BOOM_Y, hd.z));
      spanTo(_pecPost[i],  new V3(hd.x, 0.845, hd.z),      new V3(hd.x, PEC_BOOM_Y + 0.03, hd.z));
    }
  }

  if (playing || tracePts.length === 0){
    tracePts.push(mid.clone());
    if (tracePts.length > TRACE_N) tracePts.shift();
  }
  const arr = traceGeo.attributes.position.array;
  for (let i=0;i<TRACE_N;i++){
    const p = tracePts[Math.min(i, tracePts.length-1)] || mid;
    arr[i*3]=p.x; arr[i*3+1]=p.y; arr[i*3+2]=p.z;
  }
  traceGeo.attributes.position.needsUpdate = true;
  traceGeo.setDrawRange(0, Math.max(2, tracePts.length));
  trace.visible = tracePts.length > 3;

  /* measure */
  const S = { bar:mid, barStartX, t, d: P0.d ?? 0 };
  let allOK = true, worst = null;
  for (const r of metricRows){
    const v = r.def.read(P, S);
    const ok = r.def.ok(v, S);
    r.val.textContent = r.def.fmt(v);
    r.val.className = 'm-val mono ' + (ok ? '' : 'bad');
    r.flag.className = 'm-flag ' + (ok ? 'ok' : 'bad');
    if (!ok){ allOK = false; worst ||= r.def.label; }
  }
  verdict.textContent = allOK ? 'Form within tolerance'
    : worst + ' is outside the safe range for this lift';
  verdict.className = allOK ? '' : 'bad';

  /* muscle tint by activation = how far the prime mover is loaded */
  const act = 0.35 + 0.65 * Math.max(0, Math.sin(t * Math.PI));
  const g = GRAD[ex.group] || GRAD.chest;
  const c = new THREE.Color(g[0]).lerp(new THREE.Color(g[1]), act);
  for (const [k,mesh] of Object.entries(tintable)){
    if (mesh && (ex.muscles||[]).includes(k) && mesh.material !== bodyMat){
      mesh.material.color.copy(new THREE.Color(bodyMat.color).lerp(c, 0.45 + 0.35*act));
      mesh.material.emissive = c; mesh.material.emissiveIntensity = 0.06 + 0.10*act;
    }
  }

  /* hud */
  phaseName.textContent = phase.label;
  phaseCue.textContent = phase.cue;
  tNow.textContent = (t * ex.duration).toFixed(2) + 's';
  tPct.textContent = Math.round(t*100) + '%';
  [...trackEl.children].forEach((el,i) => el.classList.toggle('on', i <= phase.index));

  controls.update();
  renderer.render(scene, camera);
}

/* boot */
document.documentElement.setAttribute('data-theme','dark');
document.getElementById('themeBtn').textContent = 'Light';
syncTheme();
setExercise('chestFly');
resize();
frame();
controls.enablePan = false;
function zoomDemo(factor){ const d=camera.position.clone().sub(controls.target); const length=THREE.MathUtils.clamp(d.length()*factor,controls.minDistance,controls.maxDistance); camera.position.copy(controls.target).add(d.setLength(length)); controls.update(); }
document.getElementById('zoomIn').onclick=()=>zoomDemo(.85);
document.getElementById('zoomOut').onclick=()=>zoomDemo(1.18);
const initialView=camera.position.clone(), initialTarget=controls.target.clone();
document.getElementById('resetView').onclick=()=>{camera.position.copy(initialView);controls.target.copy(initialTarget);controls.update();};
if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;playBtn.textContent='▶';}
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;playBtn.textContent='▶';}});
</script>
</body>
